import java.security.MessageDigest

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

apply plugin: 'com.android.application'

def androidSdkDir = {
    def props = new Properties()
    def local = file('local.properties')
    if (local.exists()) {
        local.withInputStream { props.load(it) }
        if (props['sdk.dir']) return file(props['sdk.dir'])
    }
    def env = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    return env ? file(env) : null
}()

repositories {
    google()
    mavenCentral()

    // signal
    maven {
        url "https://raw.githubusercontent.com/whispersystems/maven/master/preferencefragment/releases/"
    }
    maven {
        url "https://raw.githubusercontent.com/whispersystems/maven/master/smil/releases/"
    }
    maven {
