    }
    maven {
        url "https://jcenter.bintray.com"
    }
    maven {
        url 'https://maven.aliyun.com/repository/jcenter'
    }
    maven {
        url 'https://maven.aliyun.com/repository/public'
    }

    // fallback
    maven { url 'https://jitpack.io' }

    if (androidSdkDir != null) {
        if (new File(androidSdkDir, 'extras/android/m2repository').exists()) {
            maven { url "${androidSdkDir}/extras/android/m2repository" }
        }
        if (new File(androidSdkDir, 'extras/google/m2repository').exists()) {
            maven { url "${androidSdkDir}/extras/google/m2repository" }
        }
    }

    flatDir { dirs 'libs' }
}

